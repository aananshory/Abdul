<body>
    <h1>Latihan 54 - Percabangan IF ELSE</h1>
    <p>Nama: Aan Abdurrahman Anshory</p>
    <p>NIM: 262302007</p>
    <div id="hasil"></div>

    <script>
        let nilai = 85;
        let keterangan;

        if (nilai >= 75) {
            keterangan = "Lulus";
        } else {
            keterangan = "Tidak lulus";
        }

        document.getElementById("hasil").innerHTML =
            "Nilai: " + nilai + "<br>" +
            "Keterangan: " + keterangan;
    </script>
